name: Benchmark

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}-benchmark
  cancel-in-progress: true

jobs:
  compare:
    name: Compare with base
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(just pnpm-version)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install modules
        run: just prepare

      - name: Check out the base revision
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          mkdir -p ../base/scripts
          cp scripts/benchmark.ts ../base/scripts/benchmark.ts
          ln -s "$GITHUB_WORKSPACE/node_modules" ../base/node_modules

      - name: Benchmark both revisions
        run: node scripts/benchmark-compare.ts --base ../base --out benchmark-report.md

      - name: Comment on the pull request
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark
          path: benchmark-report.md
